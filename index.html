<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mass Effect 1 UI Theme</title>
  <style>
    /* ==========================================================================
       MASS EFFECT 1 UI DESIGN SYSTEM (VARIABLES)
       ========================================================================== */
    :root {
      /* ME1 Color Palette */
      --me-bg-deep: #070b10;
      --me-bg-panel: rgba(12, 22, 34, 0.75);
      --me-bg-panel-border: rgba(0, 216, 255, 0.35);
      --me-cyan: #00d8ff;
      --me-cyan-glow: rgba(0, 216, 255, 0.4);
      --me-amber: #ff9d00;
      --me-text: #d2f2ff;
      --me-text-muted: #6b8c9e;

      /* User Adjustments */
      --banner-brightness: 0.95;    /* Default brightness multiplier */
      --banner-overlay-darkness: 0.25; /* Default darkness overlay opacity */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--me-bg-deep);
      color: var(--me-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 216, 255, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(0, 216, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 216, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    /* ==========================================================================
       HEADER & NAVIGATION
       ========================================================================== */
    header {
      padding: 1.5rem 2rem;
      border-bottom: 2px solid var(--me-cyan);
      background: linear-gradient(180deg, rgba(0,216,255,0.1) 0%, rgba(7,11,16,0.8) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px var(--me-cyan-glow);
    }

    .hud-title {
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 8px var(--me-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-title::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--me-amber);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    /* ==========================================================================
       ENTRY CONTAINER & BANNER CARDS
       ========================================================================== */
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
    }

    .entry-card {
      background: var(--me-bg-panel);
      border: 1px solid var(--me-bg-panel-border);
      backdrop-filter: blur(8px);
      margin-bottom: 2rem;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .entry-card:hover {
      border-color: var(--me-cyan);
      box-shadow: 0 0 12px var(--me-cyan-glow);
    }

    /* Banner Image Window */
    .banner-window {
      position: relative;
      height: 220px;
      overflow: hidden;
      border-bottom: 1px solid var(--me-bg-panel-border);
      background-color: #000;
    }

    .banner-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Dynamic brightness applied via JavaScript/CSS variable */
      filter: brightness(var(--banner-brightness));
      transition: filter 0.2s ease;
    }

    /* Overlay darkness layer (Adjustable) */
    .banner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(7, 11, 16, 0.1) 0%, rgba(7, 11, 16, 0.8) 100%);
      opacity: var(--banner-overlay-darkness);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .entry-content {
      padding: 1.5rem;
    }

    .entry-title {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .entry-body {
      color: var(--me-text-muted);
      line-height: 1.6;
    }

    /* ==========================================================================
       FOOTER & CONTROL MODAL
       ========================================================================== */
    footer {
      background: rgba(7, 11, 16, 0.95);
      border-top: 1px solid var(--me-bg-panel-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .hud-btn {
      background: rgba(0, 216, 255, 0.1);
      border: 1px solid var(--me-cyan);
      color: var(--me-cyan);
      padding: 0.5rem 1.25rem;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      transition: all 0.2s ease;
    }

    .hud-btn:hover {
      background: var(--me-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--me-cyan);
    }

    /* Settings Window Modal (Footer Popup) */
    .settings-window {
      display: none;
      position: absolute;
      bottom: 70px;
      right: 2rem;
      width: 320px;
      background: rgba(10, 16, 24, 0.95);
      border: 1px solid var(--me-cyan);
      padding: 1.25rem;
      box-shadow: 0 0 20px rgba(0, 216, 255, 0.25);
      backdrop-filter: blur(10px);
      z-index: 100;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .settings-window.active {
      display: block;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--me-bg-panel-border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      color: var(--me-amber);
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--me-text);
      margin-bottom: 0.4rem;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--me-cyan);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="hud-title">System Console // ME-1</div>
  </header>

  <main class="container">
    <!-- Entry Example Card -->
    <article class="entry-card">
      <div class="banner-window">
        <img class="banner-image" src="https://picsum.photos/1000/400" alt="Banner Image">
        <div class="banner-overlay"></div>
      </div>
      <div class="entry-content">
        <h2 class="entry-title">Citadel Archives: Entry #402</h2>
        <p class="entry-body">
          Banner visibility has been enhanced with reduced baseline overlay darkness. Use the system controls in the footer to fine-tune image brightness and overlay density manually.
        </p>
      </div>
    </article>
  </main>

  <!-- Footer with Settings Trigger -->
  <footer>
    <div style="font-size: 0.8rem; color: var(--me-text-muted);">
      STATUS: ONLINE // INTERFACE VER. 1.04
    </div>
    <button class="hud-btn" id="toggle-settings">⚙ Calibrate UI</button>

    <!-- Footer Settings Modal -->
    <div class="settings-window" id="settings-window">
      <div class="settings-header">
        <span>Optics Calibration</span>
        <span style="cursor:pointer;" id="close-settings">✕</span>
      </div>

      <div class="control-group">
        <label for="brightness-slider">
          <span>Banner Brightness</span>
          <span id="brightness-val">95%</span>
        </label>
        <input type="range" id="brightness-slider" min="50" max="150" value="95">
      </div>

      <div class="control-group">
        <label for="overlay-slider">
          <span>Overlay Darkness</span>
          <span id="overlay-val">25%</span>
        </label>
        <input type="range" id="overlay-slider" min="0" max="80" value="25">
      </div>
    </div>
  </footer>

  <script>
    const toggleBtn = document.getElementById('toggle-settings');
    const closeBtn = document.getElementById('close-settings');
    const settingsWindow = document.getElementById('settings-window');

    const brightnessSlider = document.getElementById('brightness-slider');
    const brightnessVal = document.getElementById('brightness-val');

    const overlaySlider = document.getElementById('overlay-slider');
    const overlayVal = document.getElementById('overlay-val');

    // Toggle Modal
    toggleBtn.addEventListener('click', () => {
      settingsWindow.classList.toggle('active');
    });

    closeBtn.addEventListener('click', () => {
      settingsWindow.classList.remove('active');
    });

    // Brightness Control
    brightnessSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      brightnessVal.textContent = `${val}%`;
      document.documentElement.style.setProperty('--banner-brightness', val / 100);
    });

    // Overlay Darkness Control
    overlaySlider.addEventListener('input', (e) => {
      const val = e.target.value;
      overlayVal.textContent = `${val}%`;
      document.documentElement.style.setProperty('--banner-overlay-darkness', val / 100);
    });
  </script>
</body>
</html>
