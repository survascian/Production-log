  <style>
    :root {
      --blue: #00A3E0;
      --cobalt: #0055FF;
      --amber: #FF9900;
      --amber-hot: #FF6600;
      --red: #FF0033;
      --bg-deep: #0A0D11;
      --bg-panel: #11161B;
    }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(ellipse 1100px 700px at 50% -8%, #16202B 0%, var(--bg-deep) 55%), var(--bg-deep);
      color: #CBD8E3;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
    }

    .font-display { font-family: 'Rajdhani', sans-serif; }

    .chamfer-lg { clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
    .chamfer-sm { clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px); }
    .chamfer-xs { clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }

    ::selection { background: var(--amber); color: #0A0D11; }

    .hologram-panel {
      background: rgba(17, 22, 27, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 0 1px rgba(0, 163, 224, 0.4), 0 0 32px rgba(0, 163, 224, 0.06);
    }

    @keyframes hologram-in {
      0% { opacity: 0; transform: scaleY(0.04); filter: brightness(2.4); }
      45% { opacity: 1; transform: scaleY(1.03); filter: brightness(1.5); }
      100% { opacity: 1; transform: scaleY(1); filter: brightness(1); }
    }
    .animate-hologram { animation: hologram-in 0.32s cubic-bezier(.2,.9,.3,1); transform-origin: top center; }

    .corner-readout {
      position: absolute;
      bottom: 6px;
      right: 14px;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(0, 163, 224, 0.5);
      font-family: 'Share Tech Mono', monospace;
    }

    .input-field {
      width: 100%;
      background: rgba(10, 13, 17, 0.85);
      box-shadow: inset 0 0 0 1px rgba(0, 163, 224, 0.25);
      color: #EAF3FA;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.875rem;
      padding: 0.55rem 0.7rem;
      outline: none;
      transition: box-shadow 0.15s, opacity 0.15s;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    .input-field:focus {
      box-shadow: inset 0 0 0 1px var(--amber), 0 0 10px rgba(255, 153, 0, 0.27);
    }
    .input-field:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-field::placeholder { color: #445162; }

    .btn-amber {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--amber); color: #0A0D11;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.875rem;
      padding: 0.6rem 1.05rem; transition: all 0.1s;
      box-shadow: 0 0 14px rgba(255, 153, 0, 0.33); cursor: pointer;
    }
    .btn-amber:hover { background: var(--amber-hot); }
    .btn-amber:active { transform: scale(0.96); filter: brightness(1.3); }

    .btn-blue {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--blue); color: #0A0D11;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.875rem;
      padding: 0.55rem 1.05rem; transition: all 0.1s;
      box-shadow: 0 0 14px rgba(0, 163, 224, 0.27); cursor: pointer;
    }
    .btn-blue:hover { background: var(--cobalt); }
    .btn-blue:active { transform: scale(0.96); filter: brightness(1.3); }

    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: #6E8399;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.875rem;
      padding: 0.55rem 1.05rem; box-shadow: inset 0 0 0 1px rgba(110, 131, 153, 0.35);
      transition: all 0.1s; cursor: pointer;
    }
    .btn-ghost:hover { color: #EAF3FA; box-shadow: inset 0 0 0 1px rgba(110, 131, 153, 0.7); }

    .tab-btn {
      font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.04em; padding: 0.35rem 0.65rem;
      transition: all 0.12s; white-space: nowrap; cursor: pointer;
    }

    .icon-btn { padding: 6px; transition: all 0.1s; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: #EAF3FA; }

    select option { background: #0A0D11; color: #EAF3FA; }
  </style>
</head>

    let editingId = null;
    let draftGenres = [];
    let unsubscribeFirestore = null;

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function todayISO() { return new Date().toISOString().slice(0, 10); }
    function fmtDate(iso) { if (!iso) return "—"; const p = iso.split("-"); return p.length === 3 ? `${p[1]}.${p[2]}.${p[0].slice(2)}` : "—"; }
    function escapeHtml(s) { return s ? String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : ""; }

    // Authentication Listeners
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const modal = document.getElementById("auth-modal");
      const logoutBtn = document.getElementById("btn-logout");
      
      if (user) {
        modal.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        attachFirestoreListener();
      } else {
        modal.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        if (unsubscribeFirestore) unsubscribeFirestore();
        entries = [];
        render();
      }
    });

    document.getElementById("btn-login").onclick = async () => {
      const e = document.getElementById("auth-email").value, p = document.getElementById("auth-password").value;
      try { await signInWithEmailAndPassword(auth, e, p); } catch(err) { showAuthError(err.message); }
    };

    document.getElementById("btn-register").onclick = async () => {
      const e = document.getElementById("auth-email").value, p = document.getElementById("auth-password").value;
      try { await createUserWithEmailAndPassword(auth, e, p); } catch(err) { showAuthError(err.message); }
    };

    document.getElementById("btn-logout").onclick = () => signOut(auth);

    function showAuthError(msg) {
      const errDiv = document.getElementById("auth-error");
      errDiv.innerText = msg; errDiv.classList.remove("hidden");
    }

    // Real-Time Cloud + Offline Listener
    function attachFirestoreListener() {
      if (!currentUser) return;
      const colRef = collection(db, "users", currentUser.uid, "entries");
      unsubscribeFirestore = onSnapshot(colRef, (snapshot) => {
        entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        render();
      });
    }

    async function syncSaveEntry(entry) {
      if (!currentUser) return;
      const docRef = doc(db, "users", currentUser.uid, "entries", entry.id);
      await setDoc(docRef, entry);
    }

    async function syncDeleteEntry(id) {
      if (!currentUser) return;
      const docRef = doc(db, "users", currentUser.uid, "entries", id);
      await deleteDoc(docRef);
    }

    function initFormSelects() {
      document.getElementById("genre-datalist").innerHTML = TOP_100_GENRES.map(g => `<option value="${escapeHtml(g)}"></option>`).join("");
      document.getElementById("input-videoType").innerHTML = VIDEO_TYPES.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
      document.getElementById("input-stage").innerHTML = STAGES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      document.getElementById("input-ownership").innerHTML = OWNERSHIP_OPTIONS.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
    }

    function renderSelectedGenres() {
      document.getElementById("selected-genres-container").innerHTML = draftGenres.map((g, idx) => `
        <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 chamfer-xs" style="background: rgba(0,163,224,0.15); color: #00A3E0; box-shadow: inset 0 0 0 1px rgba(0,163,224,0.35);">
          ${escapeHtml(g)}
          <button type="button" onclick="window.removeGenreTag(${idx})" class="hover:text-white ml-0.5">${ICONS.xSmall}</button>
        </span>
      `).join("");
    }

    window.removeGenreTag = (idx) => { draftGenres.splice(idx, 1); renderSelectedGenres(); };

    function addGenreTag() {
      const input = document.getElementById("input-genre-search"), val = input.value.trim();
      if (val && !draftGenres.includes(val)) { draftGenres.push(val); input.value = ""; renderSelectedGenres(); }
    }

    function handleUntitledToggle() {
      const isU = document.getElementById("chk-untitled").checked, tInput = document.getElementById("input-draftTitle");
      if (isU) { tInput.value = "Untitled Video"; tInput.disabled = true; } 
      else { if (tInput.value === "Untitled Video") tInput.value = ""; tInput.disabled = false; tInput.focus(); }
      checkFormValidity();
    }

    function checkFormValidity() {
      const g = document.getElementById("input-game").value.trim(), isU = document.getElementById("chk-untitled").checked, t = document.getElementById("input-draftTitle").value.trim();
      const saveBtn = document.getElementById("btn-save-entry");
      if (g && (isU || t)) { saveBtn.disabled = false; saveBtn.classList.remove("opacity-30", "cursor-not-allowed"); } 
      else { saveBtn.disabled = true; saveBtn.classList.add("opacity-30", "cursor-not-allowed"); }
    }

    function openNewForm() {
      editingId = null; draftGenres = [];
      document.getElementById("input-game").value = "";
      document.getElementById("input-genre-search").value = "";
      document.getElementById("chk-untitled").checked = false;
      document.getElementById("input-draftTitle").disabled = false;
      document.getElementById("input-draftTitle").value = "";
      document.getElementById("input-videoType").value = VIDEO_TYPES[0];
      document.getElementById("input-stage").value = STAGES[0];
      document.getElementById("input-ownership").value = OWNERSHIP_OPTIONS[0];
      document.getElementById("input-description").value = "";
      document.getElementById("input-dateUploaded").value = "";
      document.getElementById("form-title").innerText = "New Entry";
      document.getElementById("btn-save-entry").innerText = "Add Entry";
      renderSelectedGenres(); checkFormValidity(); showForm();
    }

    function openEditForm(entry) {
      editingId = entry.id; draftGenres = Array.isArray(entry.genres) ? [...entry.genres] : [];
      document.getElementById("input-game").value = entry.game || "";
      const isU = !!entry.isUntitled || entry.draftTitle === "Untitled Video";
      document.getElementById("chk-untitled").checked = isU;
      document.getElementById("input-draftTitle").disabled = isU;
      document.getElementById("input-draftTitle").value = entry.draftTitle || (isU ? "Untitled Video" : "");
      document.getElementById("input-videoType").value = entry.videoType || VIDEO_TYPES[0];
      document.getElementById("input-stage").value = entry.stage || STAGES[0];
      document.getElementById("input-ownership").value = entry.ownership || OWNERSHIP_OPTIONS[0];
      document.getElementById("input-description").value = entry.description || "";
      document.getElementById("input-dateUploaded").value = entry.dateUploaded || "";
      document.getElementById("form-title").innerText = "Edit Entry";
      document.getElementById("btn-save-entry").innerText = "Save Changes";
      renderSelectedGenres(); checkFormValidity(); showForm();
    }

    function showForm() {
      const form = document.getElementById("form-panel");
      form.classList.remove("hidden");
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeForm() { editingId = null; draftGenres = []; document.getElementById("form-panel").classList.add("hidden"); }

    async function handleSaveEntry() {
      const game = document.getElementById("input-game").value.trim(), isU = document.getElementById("chk-untitled").checked;
      let title = document.getElementById("input-draftTitle").value.trim();
      if (isU || !title) title = "Untitled Video";
      if (!game) return;

      const existing = entries.find(e => e.id === editingId) || {};
      const draft = {
        id: editingId || uid(),
        game,
        genres: [...draftGenres],
        draftTitle: title,
        isUntitled: isU,
        videoType: document.getElementById("input-videoType").value,
        stage: document.getElementById("input-stage").value,
        ownership: document.getElementById("input-ownership").value,
        description: document.getElementById("input-description").value,
        dateUploaded: document.getElementById("input-dateUploaded").value,
        dateCreated: existing.dateCreated || todayISO(),
        cancelled: !!existing.cancelled
      };

      await syncSaveEntry(draft);
      closeForm();
    }

    async function deleteEntry(id) { await syncDeleteEntry(id); }
    async function toggleCancelled(id) {
      const entry = entries.find(e => e.id === id);
      if (entry) await syncSaveEntry({ ...entry, cancelled: !entry.cancelled });
    }
    function toggleExpand(id) { expanded[id] = !expanded[id]; render(); }

    function createStageRing(stage, cancelled, size = 34) {
      const idx = STAGES.indexOf(stage), total = STAGES.length, segDeg = 360 / total, gapDeg = 6;
      const activeColor = STAGE_COLORS[stage] || "#FF9900", stops = [];
      for (let i = 0; i < total; i++) {
        const start = i * segDeg, end = start + (segDeg - gapDeg);
        let color = cancelled ? "#3A1620" : (i <= idx ? (STAGE_COLORS[STAGES[i]] || "#00A3E0") : "#1D242D");
        stops.push(`${color} ${start}deg ${end}deg`);
        stops.push(`transparent ${end}deg ${start + segDeg}deg`);
      }
      return `
        <div class="relative shrink-0 flex items-center justify-center rounded-full" style="width: ${size}px; height: ${size}px; background: conic-gradient(${stops.join(",")}); filter: ${cancelled ? 'none' : `drop-shadow(0 0 6px ${activeColor}88)`};">
          <div class="rounded-full flex items-center justify-center" style="width: ${size - 6}px; height: ${size - 6}px; background: ${cancelled ? 'rgba(17,22,27,0.85)' : '#11161B'};">
            <span class="w-1.5 h-1.5 rounded-full ${cancelled ? '' : 'animate-pulse'}" style="background: ${cancelled ? '#FF0033' : activeColor}; opacity: ${cancelled ? 0.6 : 1};"></span>
          </div>
        </div>
      `;
    }

    function renderTabs() {
      const counts = STAGES.reduce((acc, s) => { acc[s] = entries.filter(e => e.stage === s && !e.cancelled).length; return acc; }, {});
      const cancelledCount = entries.filter(e => e.cancelled).length;
      const tabs = ["All", ...STAGES, "Cancelled"];

      document.getElementById("filter-tabs-container").innerHTML = tabs.map(f => {
        const active = filter === f, isC = f === "Cancelled", sColor = STAGE_COLORS[f] || (isC ? "#FF0033" : "#FF9900");
        let badge = (f !== "All" && f !== "Cancelled" && counts[f] > 0) ? `<span class="ml-1 opacity-70">${counts[f]}</span>` : (isC && cancelledCount > 0 ? `<span class="ml-1 opacity-70">${cancelledCount}</span>` : '');
        const style = active ? `background: ${sColor}; color: #0A0D11; box-shadow: 0 0 12px ${sColor}88; font-weight: 700;` : `background: rgba(0,163,224,0.06); color: #6E8399; box-shadow: inset 0 0 0 1px rgba(0,163,224,0.18);`;
        return `<button data-filter="${escapeHtml(f)}" class="tab-btn chamfer-xs filter-tab-btn" style="${style}">${escapeHtml(f)}${badge}</button>`;
      }).join("");

      document.querySelectorAll(".filter-tab-btn").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
    }

    function renderList() {
      const visible = entries
        .filter(e => filter === "All" ? true : filter === "Cancelled" ? e.cancelled : e.stage === filter && !e.cancelled)
        .sort((a, b) => {
          const cmp = (a.dateCreated || "").localeCompare(b.dateCreated || "") || a.id.localeCompare(b.id);
          return sortDir === "desc" ? -cmp : cmp;
        });

      const listContainer = document.getElementById("entries-container"), emptyState = document.getElementById("empty-state");
      if (visible.length === 0) {
        listContainer.innerHTML = "";
        emptyState.innerText = entries.length === 0 ? "Nothing logged yet. Add your first entry to start." : "No entries match this filter.";
        emptyState.classList.remove("hidden"); return;
      }

      emptyState.classList.add("hidden");
      listContainer.innerHTML = visible.map(entry => {
        const c = entry.cancelled, isOpen = !!expanded[entry.id], sColor = STAGE_COLORS[entry.stage] || "#FF9900";
        const isU = !!entry.isUntitled || entry.draftTitle === "Untitled Video", isTbd = entry.videoType === "TBD / Unassigned";
        const ownership = entry.ownership || "Owned";
        const needsFinalizing = !c && ["Queue", "Editing", "Review", "Published"].includes(entry.stage) && (isU || isTbd);

        const genreBadges = (entry.genres || []).map(g => `<span class="text-[10px] px-1.5 py-0.5 chamfer-xs" style="color: ${c ? '#3A4452' : '#7D9BBA'}; background: rgba(0,163,224,0.08); box-shadow: inset 0 0 0 1px rgba(0,163,224,0.2);">${escapeHtml(g)}</span>`).join("");
        const typeStyle = isTbd ? `color: #6E8399; border: 1px dashed rgba(110,131,153,0.4);` : `box-shadow: inset 0 0 0 1px rgba(0,163,224,0.3); color: #CBD8E3;`;
        const titleHtml = isU ? `<span class="italic text-sm" style="color: ${c ? '#3A4452' : '#5A6C7D'};">[ UNTITLED PROJECT ]</span>` : escapeHtml(entry.draftTitle);

        let oStyle = `color: #00A3E0; background: rgba(0,163,224,0.1); box-shadow: inset 0 0 0 1px rgba(0,163,224,0.3);`;
        if (ownership === "Jack Sparrow") oStyle = `color: #FF9900; background: rgba(255,153,0,0.1); box-shadow: inset 0 0 0 1px rgba(255,153,0,0.3);`;
        else if (ownership === "Unowned") oStyle = `color: #6E8399; background: rgba(110,131,153,0.1); box-shadow: inset 0 0 0 1px rgba(110,131,153,0.3);`;

        return `
          <div class="chamfer-lg relative" style="background: ${c ? 'rgba(17,22,27,0.4)' : 'rgba(17,22,27,0.65)'}; backdrop-filter: blur(6px); box-shadow: ${c ? 'inset 0 0 0 1px rgba(255,0,51,0.18)' : 'inset 0 0 0 1px rgba(0,163,224,0.28)'};">
            <div class="flex items-start gap-3 px-4 py-3">
              <button data-action="toggle" data-id="${entry.id}" class="mt-1 icon-btn shrink-0" style="color: #6E8399;">${isOpen ? ICONS.chevronUp : ICONS.chevronDown}</button>
              ${createStageRing(entry.stage, c)}
              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="font-display font-700 text-lg uppercase leading-none ${c ? 'line-through decoration-2' : ''}" style="color: ${c ? '#4A5566' : '#EAF3FA'};">${escapeHtml(entry.game)}</span>
                  ${genreBadges}
                </div>
                <div class="mt-1 flex items-center gap-2">${titleHtml}${needsFinalizing ? `<span class="text-[9px] px-1.5 uppercase font-semibold chamfer-xs" style="background: rgba(255,153,0,0.15); color: var(--amber); box-shadow: inset 0 0 0 1px rgba(255,153,0,0.4);">Finalize Details</span>` : ''}</div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-[10px] uppercase tracking-wide" style="color: #5A6C7D;">
                  <span class="chamfer-xs px-1.5 py-0.5" style="${typeStyle}">${isTbd ? 'TYPE: TBD' : escapeHtml(entry.videoType)}</span>
                  ${!c ? `<span class="font-semibold px-2 py-0.5 chamfer-xs" style="color: ${sColor}; background: ${sColor}18; box-shadow: inset 0 0 0 1px ${sColor}44;">${escapeHtml(entry.stage)}</span>` : '<span class="font-semibold px-2 py-0.5 chamfer-xs" style="color: #FF0033; background: rgba(255,0,51,0.1);">Cancelled</span>'}
                  <span class="ml-auto" style="color: #3A4452;">${fmtDate(entry.dateCreated)}</span>
                </div>
              </div>
              <div class="flex items-center gap-0.5 shrink-0">
                <button data-action="cancel" data-id="${entry.id}" class="icon-btn" style="color: ${c ? '#00A3E0' : '#6E8399'};">${c ? ICONS.rotateCcw : ICONS.ban}</button>
                <button data-action="edit" data-id="${entry.id}" class="icon-btn" style="color: #6E8399;">${ICONS.pencil}</button>
                <button data-action="delete" data-id="${entry.id}" class="icon-btn" style="color: #6E8399;">${ICONS.trash}</button>
              </div>
            </div>
            ${isOpen ? `
              <div class="px-4 pb-4 pt-3 ml-11 ${c ? 'opacity-50' : ''}" style="box-shadow: inset 0 1px 0 0 rgba(0,163,224,0.2);">
                <p class="text-sm leading-relaxed whitespace-pre-wrap" style="color: #A9BBCB;">${escapeHtml(entry.description || 'No description.')}</p>
                <div class="flex flex-wrap items-center justify-between gap-y-2 mt-3 text-[11px]" style="color: #5A6C7D;">
                  <div class="flex items-center gap-2"><span>Ownership:</span><span class="px-1.5 py-0.5 chamfer-xs font-semibold uppercase" style="${oStyle}">${escapeHtml(ownership)}</span></div>
                  <div class="flex items-center gap-4"><span>Logged: <span style="color: #A9BBCB;">${fmtDate(entry.dateCreated)}</span></span><span>Uploaded: <span style="color: #A9BBCB;">${fmtDate(entry.dateUploaded)}</span></span></div>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }).join("");

      listContainer.onclick = function(e) {
        const btn = e.target.closest("button[data-action]"); if (!btn) return;
        const act = btn.dataset.action, id = btn.dataset.id, item = entries.find(i => i.id === id);
        if (act === "toggle") toggleExpand(id);
        if (act === "cancel") toggleCancelled(id);
        if (act === "edit" && item) openEditForm(item);
        if (act === "delete") deleteEntry(id);
      };
    }

    function render() {
      document.getElementById("entry-count-readout").innerHTML = `// gameplay.pipeline &nbsp;·&nbsp; ${entries.length} entr${entries.length === 1 ? "y" : "ies"} synced`;
      document.getElementById("icon-plus").innerHTML = ICONS.plus;
      document.getElementById("icon-close").innerHTML = ICONS.x;
      document.getElementById("icon-logout").innerHTML = ICONS.logout;
      document.getElementById("sort-icon").innerHTML = sortDir === "desc" ? ICONS.chevronDown : ICONS.chevronUp;
      renderTabs(); renderList();
    }

    document.addEventListener("DOMContentLoaded", () => {
      initFormSelects();
      document.getElementById("btn-open-new").onclick = openNewForm;
      document.getElementById("btn-close-form").onclick = closeForm;
      document.getElementById("btn-cancel-form").onclick = closeForm;
      document.getElementById("btn-save-entry").onclick = handleSaveEntry;
      document.getElementById("chk-untitled").onchange = handleUntitledToggle;
      document.getElementById("btn-add-genre").onclick = addGenreTag;
      document.getElementById("input-genre-search").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); addGenreTag(); } };
      document.getElementById("input-game").oninput = checkFormValidity;
      document.getElementById("input-draftTitle").oninput = checkFormValidity;
      document.getElementById("btn-toggle-sort").onclick = () => { sortDir = sortDir === "desc" ? "asc" : "desc"; render(); };
    });
  </script>
</body>
</html>
